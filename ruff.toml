# Lint config only; this repo ships no python package... yet.
# Rules copied in full

line-length = 88

[lint]
extend-select = [
    "W292",     # missing newline at end of file
    "C90",      # mccabe cyclomatic complexity
    "C4",       # flake8-comprehensions
    "ERA",      # commented-out code
    "FBT",      # boolean positional/default args
    "PLR0913",  # too many arguments
]
ignore = ["E701"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
