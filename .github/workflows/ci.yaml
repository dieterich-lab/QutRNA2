name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # a dry run builds the DAG without running any rule, so snakemake and the
      # PEP machinery cover everything it touches without building full conda env
      - run: pip install "snakemake==9.8.*" pytest pandas pyyaml peppy eido click pysam biopython

      - run: pytest tests -q

      - name: snakemake dry run
        run: |
          workdir=$(mktemp -d)
          python tests/prepare_dryrun.py "$workdir"
          cd "$workdir"
          snakemake -s "$GITHUB_WORKSPACE/workflow/Snakefile" \
            --configfile analysis.yaml \
            --config pepfile=data/data.yaml \
            --cores 2 -n --quiet rules -- all report